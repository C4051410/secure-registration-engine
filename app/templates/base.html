<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Secure Registration{% endblock %}</title>
<style>
/* Basic styling for UX/readability */
body{ font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width:700px; margin:2rem auto; padding:1rem }
.error{ color: #b00020; font-weight: bold; }
.success{ color: #006400; font-weight: bold; }
label{ display:block; margin-top:0.5rem; font-weight: 500; }
input:not([type="submit"]), textarea { width:100%; padding:0.5rem; margin-top:0.25rem; box-sizing: border-box; }
.field { margin-bottom:1rem }
</style>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, msg in messages %}
            <div class="{{ category }}">{{ msg }}</div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
