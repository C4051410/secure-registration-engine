<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Secure Registration{% endblock %}</title>
<style>
body{ font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width:700px; margin:2rem auto; padding:1rem }
.error{ color: #b00020 }
.success{ color: #006400 }
label{ display:block; margin-top:0.5rem }
input, textarea { width:100%; padding:0.5rem; margin-top:0.25rem }
.field { margin-bottom:0.5rem }
</style>
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, msg in messages %}
<div class="{{ category }}">{{ msg }}</div>
{% endfor %}
{% endif %}
{% endwith %}


{% block content %}{% endblock %}
</body>
</html>
